[package]
name = "cdd-storage"
version = "0.0.1"
edition = "2024"

[lib]
name = "cdd_storage"
path = "src/lib.rs"

[[bin]]
name = "cdd-storage"
path = "src/main.rs"

[dependencies]
actix-web = { version = "4.17", default-features = false, features = ["macros"] }
derive_more = { version = "2.1", default-features = false, features = ["display", "error", "from"] }
httpdate = { version = "1.0", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"] }
sha2 = { version = "0.11", default-features = false }
tokio = { version = "1.54", default-features = false, features = ["fs"] }

[dev-dependencies]
tempfile = "3.27"

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
missing_docs_in_private_items = "deny"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
